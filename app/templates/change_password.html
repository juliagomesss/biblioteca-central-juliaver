{% extends "base.html" %}
{% block page_title %}Alterar Senha{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">
        <div class="panel">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                    <i class="bi bi-shield-lock fs-2"></i>
                </div>
                <h3 class="mb-1">Alterar Senha</h3>
                <p class="text-muted small">Atualize sua senha de acesso ao sistema.</p>
            </div>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                
                <div class="mb-3">
                    <label>Senha Atual *</label>
                    <input type="password" name="current_password" class="form-control" placeholder="Digite sua senha atual" required autofocus>
                </div>
                
                <hr class="my-4 text-muted">
                
                <div class="mb-3">
                    <label>Nova Senha *</label>
                    <input type="password" name="new_password" class="form-control" placeholder="Mínimo de 10 caracteres" required minlength="10">
                </div>
                
                <div class="mb-4">
                    <label>Confirme a Nova Senha *</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Digite novamente a nova senha" required minlength="10">
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary py-2">Salvar Nova Senha</button>
                    <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
